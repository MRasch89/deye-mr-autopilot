name: Optional dependency compatibility

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-314-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Resolve optional libraries
        run: python -m pip install --upgrade pip langgraph pysolarmanv5
      - name: Import optional libraries
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import langgraph
          import pysolarmanv5
          from langgraph.graph import END, START, StateGraph
          from pysolarmanv5 import PySolarmanV5Async

          print("langgraph", metadata.version("langgraph"))
          print("pysolarmanv5", metadata.version("pysolarmanv5"))
          print(StateGraph, START, END, PySolarmanV5Async)
          PY

